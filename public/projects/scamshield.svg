    <circle cx="220" cy="220" r="85" fill="none" stroke="url(#accent)" stroke-width="14" stroke-dasharray="534" stroke-dashoffset="120" stroke-linecap="round"/>
    <text x="220" y="215" font-family="system-ui, sans-serif" font-size="44" font-weight="800" fill="#f8fafc" text-anchor="middle">88</text>
