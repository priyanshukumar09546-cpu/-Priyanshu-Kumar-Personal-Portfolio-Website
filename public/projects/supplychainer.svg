<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="sc-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070a12"/>
      <stop offset="50%" stop-color="#0f1422"/>
      <stop offset="100%" stop-color="#080b13"/>
    </linearGradient>
    <radialGradient id="sc-glow" cx="65%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sc-grid" width="36" height="36" patternUnits="userSpaceOnUse">
      <path d="M 36 0 L 0 0 0 36" fill="none" stroke="rgba(255,255,255,0.035)" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="675" fill="url(#sc-bg)"/>
  <rect width="1200" height="675" fill="url(#sc-grid)"/>
  <circle cx="750" cy="320" r="420" fill="url(#sc-glow)"/>

  <!-- Main Container -->
  <g transform="translate(140, 60)">
    <rect width="920" height="540" rx="16" fill="#121624" stroke="rgba(255,255,255,0.09)" stroke-width="1.5"/>
    
    <!-- Header -->
    <rect width="920" height="48" rx="16" fill="#171d2e"/>
    <circle cx="28" cy="24" r="6" fill="#ef4444" opacity="0.8"/>
    <circle cx="48" cy="24" r="6" fill="#f59e0b" opacity="0.8"/>
    <circle cx="68" cy="24" r="6" fill="#10b981" opacity="0.8"/>
    <text x="460" y="30" font-family="system-ui, sans-serif" font-size="13" font-weight="600" fill="#94a3b8" text-anchor="middle">Supply-Chainer — AI Route Optimization &amp; Disruption Simulation</text>

    <!-- Left: Quantile Delay Chart -->
    <rect x="40" y="80" width="370" height="420" rx="12" fill="#171d2b" stroke="rgba(255,255,255,0.05)"/>
    <text x="65" y="120" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Quantile Delay Estimation</text>
    <text x="65" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">Probabilistic Tail-Risk vs. Naive Point-Estimates</text>

    <!-- Bars for quantiles -->
    <rect x="65" y="170" width="320" height="60" rx="8" fill="#1f2638"/>
    <text x="80" y="195" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#38bdf8">p10 Optimistic Horizon</text>
    <text x="80" y="215" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">12.4 Days (Ideal customs throughput)</text>

    <rect x="65" y="245" width="320" height="60" rx="8" fill="#1f2638"/>
    <text x="80" y="270" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f59e0b">p50 Median Expected</text>
    <text x="80" y="290" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">15.8 Days (Normal chokepoint queuing)</text>

    <rect x="65" y="320" width="320" height="60" rx="8" fill="#1f2638" stroke="rgba(239,68,68,0.3)"/>
    <text x="80" y="345" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#f87171">p90 Severe Disruption Tail</text>
    <text x="80" y="365" font-family="system-ui, sans-serif" font-size="11" fill="#cbd5e1">24.1 Days (Port backlog + weather anomaly)</text>

    <!-- Buffer recommendation -->
    <rect x="65" y="405" width="320" height="70" rx="8" fill="rgba(245,158,11,0.08)" stroke="rgba(245,158,11,0.25)"/>
    <text x="80" y="430" font-family="system-ui, sans-serif" font-size="12" font-weight="700" fill="#fbbf24">Safety Stock Buffer Advice</text>
    <text x="80" y="455" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">+8.3 Days safety buffer advised for APAC nodes</text>

    <!-- Right: Network Graph DAG -->
    <rect x="440" y="80" width="440" height="420" rx="12" fill="#151a28" stroke="rgba(255,255,255,0.05)"/>
    <text x="470" y="120" font-family="system-ui, sans-serif" font-size="16" font-weight="800" fill="#f8fafc">Multi-Echelon Freight DAG</text>
    <text x="470" y="140" font-family="system-ui, sans-serif" font-size="11" fill="#94a3b8">NetworkX Topological Sort &amp; Pareto Optimal Routing</text>

    <!-- Nodes and Links -->
    <!-- Edges -->
    <line x1="530" y1="230" x2="640" y2="200" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4"/>
    <line x1="530" y1="230" x2="640" y2="300" stroke="#38bdf8" stroke-width="3"/>
    <line x1="640" y1="200" x2="780" y2="230" stroke="#f59e0b" stroke-width="2.5" stroke-dasharray="4"/>
    <line x1="640" y1="300" x2="780" y2="300" stroke="#38bdf8" stroke-width="3"/>
    <line x1="780" y1="230" x2="820" y2="270" stroke="#10b981" stroke-width="2.5"/>
    <line x1="780" y1="300" x2="820" y2="270" stroke="#10b981" stroke-width="2.5"/>

    <!-- Nodes -->
    <circle cx="530" cy="230" r="22" fill="#1e2538" stroke="#f59e0b" stroke-width="2"/>
    <text x="530" y="234" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">SHA</text>

    <circle cx="640" cy="200" r="22" fill="#1e2538" stroke="#ef4444" stroke-width="2"/>
    <text x="640" y="204" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f87171" text-anchor="middle">SUEZ</text>

    <circle cx="640" cy="300" r="22" fill="#1e2538" stroke="#38bdf8" stroke-width="2"/>
    <text x="640" y="304" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">CAPE</text>

    <circle cx="780" cy="230" r="22" fill="#1e2538" stroke="#94a3b8" stroke-width="2"/>
    <text x="780" y="234" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#f8fafc" text-anchor="middle">ROT</text>

    <circle cx="780" cy="300" r="22" fill="#1e2538" stroke="#38bdf8" stroke-width="2"/>
    <text x="780" y="304" font-family="system-ui, sans-serif" font-size="10" font-weight="700" fill="#38bdf8" text-anchor="middle">HAM</text>

    <circle cx="820" cy="270" r="24" fill="#10b981" stroke="#059669" stroke-width="2"/>
    <text x="820" y="274" font-family="system-ui, sans-serif" font-size="10" font-weight="800" fill="#090a0f" text-anchor="middle">DEST</text>

    <!-- Legend -->
    <rect x="470" y="420" width="380" height="55" rx="8" fill="#1c2233"/>
    <text x="490" y="443" font-family="system-ui, sans-serif" font-size="11" fill="#38bdf8">● Active Recommended Route (Cape Bypass — Low Variance)</text>
    <text x="490" y="462" font-family="system-ui, sans-serif" font-size="11" fill="#f87171">● Congested Chokepoint (Suez Bottleneck — High Delay Risk)</text>
  </g>
</svg>
